# DatLens_OCR — Ollama-only build (no docling/torch, small image)
#
#   docker compose up -d --build     → http://localhost:8901
#
# Ollama is NOT part of this stack. Point the UI's Ollama panel at your
# remote server (e.g. http://192.168.x.x:11434) — the container only needs
# network reachability to it.

name: datlens-ollama

services:
  app:
    build: .
    image: datlens-ocr-ollama:latest
    ports:
      - "${DATLENS_PORT:-8901}:8901"
    environment:
      DATLENS_MAX_CONCURRENT_JOBS: "${DATLENS_MAX_CONCURRENT_JOBS:-2}"
      DATLENS_ALLOW_PRIVATE_URLS: "${DATLENS_ALLOW_PRIVATE_URLS:-0}"
    restart: unless-stopped
    # No volumes required — uploads live in /data/scratch inside the container
    # and are cleaned up when jobs finish. If you want crash forensics, mount
    # one:  - datlens-scratch:/data/scratch
